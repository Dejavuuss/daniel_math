<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Репетитор по математике — вход</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <h1>📐 Математика с Марией Ивановной</h1>
      <p class="muted" style="text-align:center">Личный кабинет ученика</p>
      <form id="loginForm">
        <label for="loginName">Имя (логин)</label>
        <input id="loginName" autocomplete="username" required>
        <label for="password">Пароль</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <label class="check"><input type="checkbox" id="remember"> Запомнить меня</label>
        <button class="primary" type="submit">Войти</button>
        <div class="error" id="loginError"></div>
      </form>
      <div style="text-align:center"><button id="themeBtn" type="button">🌓 Тема</button></div>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
