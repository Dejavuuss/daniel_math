<!doctype html>
<html lang="ru" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — Математика с репетитором</title>
<meta name="theme-color" content="#ffffff">
<script>document.documentElement.classList.add("js");try{document.documentElement.dataset.theme=localStorage.getItem("tutor_theme_v2")||"light"}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23e30613'/%3E%3Ctext x='32' y='46' font-size='40' font-weight='800' text-anchor='middle' fill='%23fff' font-family='Helvetica,Arial,sans-serif'%3E%CE%A3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body class="page-login">
<main class="login-wrap">
    <figure class="exhibit" data-reveal="3">
        <div class="frame" id="art"></div>
        <figcaption class="placard">
            <b>Леонардо да Винчи</b>
            <i>Витрувианский человек</i>
            <span>Около 1490. Перо, тушь. Галерея Академии, Венеция</span>
            <p>Рисунок пропорций человека по трактату древнеримского архитектора Витрувия. Геометрия этого листа разобрана ниже, в этюде.</p>
        </figcaption>
    </figure>

    <section class="login-card">
        <span class="logo" aria-hidden="true">Σ</span>
        <h1>Математика с&nbsp;репетитором</h1>
        <p class="lede">Задания, оценки и расписание занятий — для ученика, родителя и репетитора.</p>
        <form id="loginForm">
            <label for="loginUsername">Логин</label>
            <input id="loginUsername" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            <label for="loginPassword">Пароль</label>
            <input id="loginPassword" type="password" autocomplete="current-password" required>
            <button class="primary" type="submit" id="loginBtn">Войти</button>
            <p id="loginError" class="error" role="alert"></p>
            <p id="demoHint" class="form-hint" hidden>Демо-режим: войдите как teacher, ivan или parent_ivan с любым паролем.</p>
        </form>
        <div class="quote" id="quote"></div>
    </section>
</main>
<div class="container gallery-wrap"><div id="gallery" class="gallery"></div></div>
<script type="module">
import { login, getCurrentUser, homeFor, DEMO } from "./js/auth.js";
import { initPage, rotateQuotes, leave } from "./js/fx.js";
import { QUOTES } from "./js/art.js";
import { mountHall, mountGallery } from "./js/gallery.js";

const current = getCurrentUser();
if (current) location.replace(homeFor(current.role));

initPage();
mountHall(document.getElementById("art"), "vitruvian");
mountGallery(document.getElementById("gallery"), "login");
rotateQuotes(document.getElementById("quote"), QUOTES.login);
document.getElementById("demoHint").hidden = !DEMO;

document.getElementById("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn"), err = document.getElementById("loginError");
    btn.disabled = true; btn.textContent = "Входим…"; err.textContent = "";
    try {
        const user = await login(document.getElementById("loginUsername").value, document.getElementById("loginPassword").value);
        leave(homeFor(user.role));
    } catch (ex) {
        err.textContent = ex.message;
        btn.disabled = false; btn.textContent = "Войти";
    }
});
</script>
<script type="module" src="js/assistant.js"></script>
</body></html>
