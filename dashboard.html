<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Личный кабинет</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1 id="greeting">Привет!</h1>
      <div class="actions">
        <a class="btn" id="adminLink" href="admin.html" hidden>⚙️ Админка</a>
        <button id="themeBtn">🌓</button>
        <button id="logoutBtn">Выйти</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="tabs">
      <button class="tab active" data-tab="materials">📚 Учебные материалы</button>
      <button class="tab" data-tab="homework">📝 Домашние задания</button>
      <button class="tab" data-tab="calendar">📅 Календарь 2026</button>
    </div>

    <section id="materials" class="tab-panel active card"></section>
    <section id="homework" class="tab-panel card"></section>
    <section id="calendar" class="tab-panel card"></section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
